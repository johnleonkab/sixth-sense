<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Wingman</title>
        <style>
            :root {
                --ink: #18181b;
                --muted: #71717a;
                --line: #e4e4e7;
                --accent: #2f54eb;
                --ok: #15803d;
                --bad: #b91c1c;
                --surface: #ffffff;
                --soft: #f4f4f5;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --ink: #f4f4f5;
                    --muted: #a1a1aa;
                    --line: #3f3f46;
                    --accent: #7b93ff;
                    --ok: #4ade80;
                    --bad: #f87171;
                    --surface: #18181b;
                    --soft: #27272a;
                }
            }
            body {
                width: 340px;
                margin: 0;
                padding: 14px 16px 16px;
                font: 13px/1.45 system-ui, sans-serif;
                color: var(--ink);
                background: var(--surface);
            }
            h1 {
                margin: 0 0 10px;
                font-size: 14px;
                font-weight: 600;
            }
            dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 4px 12px;
                margin: 0 0 12px;
            }
            dt {
                color: var(--muted);
            }
            dd {
                margin: 0;
            }
            .ok {
                color: var(--ok);
            }
            .bad {
                color: var(--bad);
            }
            #lines {
                max-height: 150px;
                overflow: auto;
                margin: 0 0 12px;
                padding: 8px 10px;
                border-radius: 10px;
                background: var(--soft);
                font-size: 12px;
            }
            #lines p {
                margin: 0 0 4px;
            }
            #lines b {
                font-weight: 600;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 8px;
            }
            button {
                padding: 5px 10px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--surface);
                color: var(--ink);
                font: inherit;
                cursor: pointer;
            }
            button:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            h2 {
                margin: 14px 0 6px;
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
            }
            #audio {
                color: var(--muted);
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <h1>Wingman · spike de captura</h1>

        <dl>
            <dt>Llamada</dt>
            <dd id="call">—</dd>
            <dt>Subtítulos</dt>
            <dd id="captions">—</dd>
            <dt>Frases</dt>
            <dd id="count">—</dd>
            <dt>Quién habla</dt>
            <dd id="speakers">—</dd>
        </dl>

        <div id="lines"><p>Abre esto con la pestaña de Meet delante.</p></div>

        <div class="row">
            <button id="toggle-hidden">Mostrar subtítulos</button>
            <button id="export">Exportar transcripción</button>
            <button id="export-html">Exportar HTML de subtítulos</button>
        </div>

        <h2>Opción B · audio de la pestaña</h2>
        <div class="row">
            <button id="audio-test">Probar 6 s de audio</button>
        </div>
        <div id="audio"></div>

        <script src="popup.js"></script>
    </body>
</html>
